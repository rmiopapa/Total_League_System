name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r LeaguePost/requirements.txt

      - name: Build LeaguePost
        shell: pwsh
        working-directory: LeaguePost
        run: |
          pyinstaller --clean --noconfirm LeaguePost.spec

      - name: Prepare portable package
        shell: pwsh
        run: |
          $package = "Total_League_System"
          $rosterDir = Get-ChildItem -Directory | Where-Object { $_.Name -ne "LeaguePost" -and $_.Name -ne "Neo_Phoenix" -and $_.Name -ne $package } | Select-Object -First 1
          if (-not $rosterDir) { throw "Roster system folder was not found." }
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item -LiteralPath "LeaguePost\dist\LeaguePost.exe" -Destination "$package\LeaguePost.exe" -Force
          Copy-Item -Path "LeaguePost\*.docx" -Destination "$package\" -Force
          Copy-Item -LiteralPath "Neo_Phoenix" -Destination "$package\Neo_Phoenix" -Recurse -Force
          Copy-Item -LiteralPath $rosterDir.FullName -Destination "$package\$($rosterDir.Name)" -Recurse -Force
          Compress-Archive -Path "$package\*" -DestinationPath "Total_League_System_Windows_x64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Total_League_System_Windows_x64
          path: Total_League_System_Windows_x64.zip
